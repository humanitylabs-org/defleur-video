name: Build, test and publish image
# This repo is the source of truth for DeFleur Video. Every push to main builds the image natively on
# amd64 and on arm64 (never under emulation), runs the unit suite and James' audio gate inside the
# hardened container on each, then publishes the exact tested images as one multi-arch tag
# ghcr.io/humanitylabs-org/defleur-video-app:<runtipi version> (a package linked to this repo; the older
# ghcr.io/humanitylabs-org/defleur-video belongs to wizard-app-store). arm64 is what the Company's Mac
# render worker runs (wizard-os#997). Pull requests build and test both without publishing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the release version
        id: v
        run: echo "version=$(python3 -c 'import json; print(json.load(open("runtipi/config.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - name: Recipe, wizard.md and service agree on the version
        run: |
          V='${{ steps.v.outputs.version }}'
          grep -q "image: ghcr.io/humanitylabs-org/defleur-video-app:$V\$" runtipi/docker-compose.yml
          grep -q "^version: $V\$" wizard.md
          grep -q "^VERSION = \"$V\"" service.py
      - name: Build natively; unit suite and audio gate in the hardened container
        run: |
          VIDEO_IMAGE=defleur-video:ci TMPDIR="$RUNNER_TEMP" sh test-container.sh
          test "$(docker image inspect -f '{{.Architecture}}' defleur-video:ci)" = '${{ matrix.arch }}'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image for this architecture
        if: github.event_name != 'pull_request'
        run: |
          V='${{ steps.v.outputs.version }}'
          docker tag defleur-video:ci "ghcr.io/humanitylabs-org/defleur-video-app:$V-${{ matrix.arch }}"
          docker push "ghcr.io/humanitylabs-org/defleur-video-app:$V-${{ matrix.arch }}"
  publish:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One tag for both architectures (amd64 + arm64)
        run: |
          V='${{ needs.image.outputs.version }}'
          R=ghcr.io/humanitylabs-org/defleur-video-app
          for tag in "$V" "main-${GITHUB_SHA::7}"; do
            docker buildx imagetools create -t "$R:$tag" "$R:$V-amd64" "$R:$V-arm64"
          done
          docker buildx imagetools inspect "$R:$V" | tee /dev/stderr | grep -q 'linux/arm64'
