name: wizard.md check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pyyaml
      - name: House policy regressions (no media/model/network required)
        run: python3 -m unittest -v test_house
      - name: House component syntax
        run: node --check defleur/house/content/components.js
      - name: wizard.md passes the Wizard OS checker
        run: python3 .github/wizard/wizardmd.py .   # vendored from wizard-app-manager; refresh when the spec changes
