<html>

<div id="b2" class="scene">
  <svg class="art" viewBox="0 0 1080 1920">
    <defs>
      <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#5a6067"/><stop offset="0.45" stop-color="#b8c0c8"/><stop offset="1" stop-color="#4a4f55"/>
      </linearGradient>
    </defs>
    <text id="b2hA" class="anton" x="540" y="330" text-anchor="middle" font-size="84" fill="#f3ece2">YEAR 1</text>
    <text id="b2hB" class="anton" x="540" y="330" text-anchor="middle" font-size="84" fill="#f3ece2">REALLY LIVING?</text>
    <text id="b2hC" class="anton" x="540" y="330" text-anchor="middle" font-size="96" fill="#e5533d">A SENTENCE</text>
    <g id="b2grid"></g>
    <g id="b2bars"></g>
    <text id="b2tagA" class="inter" x="330" y="1150" text-anchor="middle" font-size="48" fill="#e9b45c">SAME MEALS</text>

    <text id="b2tagC" class="anton" x="540" y="1160" text-anchor="middle" font-size="72" fill="#e9b45c">0 EXCEPTIONS</text>
  </svg>
</div>

<!-- Beat 3 · 35.70-41.80 · the bars lift; experience, love, integration, chaos get woven together -->
<div id="b3" class="scene">
  <svg class="art" viewBox="0 0 1080 1920">
    <defs>
      <radialGradient id="glow"><stop offset="0" stop-color="#fff3dc" stop-opacity="0.9"/><stop offset="0.5" stop-color="#e9b45c" stop-opacity="0.35"/><stop offset="1" stop-color="#e9b45c" stop-opacity="0"/></radialGradient>
    </defs>
    <text id="b3h" class="anton" x="540" y="330" text-anchor="middle" font-size="84" fill="#f3ece2">PURPOSE OF LIFE</text>

    <g id="b3core"><circle cx="540" cy="760" r="150" fill="url(#glow)"/><circle cx="540" cy="760" r="34" fill="#fff3dc"/></g>
    <g id="b3nodes"></g>
    <g id="b3bars"></g>
  </svg>
</div>

<!-- Beat 4 · 66.00-74.20 · not seconds existing: quality x time -->
<div id="b4" class="scene">
  <svg class="art" viewBox="0 0 1080 1920">

    <text id="b4hA" class="anton" x="540" y="330" text-anchor="middle" font-size="84" fill="#f3ece2">SECONDS</text>

    <text id="b4secs" class="inter" x="540" y="1010" text-anchor="middle" font-size="48" fill="#f3ece2">SECONDS EXISTING</text>
    <text id="b4alive" class="anton" x="540" y="830" text-anchor="middle" font-size="104" fill="#1a120b">ALIVENESS</text>
